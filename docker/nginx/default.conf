# docker/nginx/default.conf — proxy FastCGI către PHP-FPM (`app:9000`).

# OPS-08 (audit infra 2026-09-23): fără astea, `$remote_addr` e IP-ul intern al
# containerului Traefik, nu al vizitatorului — logurile proprii nginx (stdout, capturate
# de driverul `json-file`) deveneau inutile pentru depanare/abuz. Sigur de avut încredere
# în tot spațiul privat aici: `nginx` NU publică niciun port (docker-compose.coolify.yml,
# `expose: ["80"]`, fără `ports:`) — singura cale către container e prin rețeaua internă
# Docker, prin Traefik. Subnetul exact pe care Coolify atașează Traefik nu se poate citi
# din acest repo (configurare Coolify UI), deci se acoperă tot spațiul RFC1918 pe care
# Docker îl alocă implicit rețelelor bridge/overlay, nu doar subnetul curent al `internal`.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 32m;

    # PERF-04 — compresie text; binarele (imagini, fonturi woff2) sunt deja comprimate,
    # de aici lista explicită de tipuri în loc de `gzip_types *`. Nivel moderat (6, implicit
    # gzip_comp_level când directiva lipsește ar fi 1 — prea slab pentru JS/CSS de Vite):
    # 6 e recomandarea nginx pentru raportul CPU/economie pe un container cu 64m.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
        application/json application/xml application/xml+rss image/svg+xml;

    # Pentru fișierele statice din public/, pe care PHP nu le vede. Răspunsurile aplicației
    # primesc aceleași headere și din App\Http\Middleware\SecurityHeaders (§20.2), deci
    # valorile de aici TREBUIE să fie identice cu cele de acolo: două valori contradictorii
    # pentru X-Frame-Options (era SAMEORIGIN aici, DENY în specificație) îl pot anula.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), clipboard-write=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # PERF-04 — assets-urile din `public/build` sunt fingerprint-ate de Vite (hash în
    # numele fișierului): un `Cache-Control` de un an e sigur, un build nou schimbă
    # numele fișierului, nu conținutul unuia vechi. `^~` (prefix match, fără regex) ca
    # nginx să nu mai evalueze deloc `location ~ \.php$` de mai jos pentru aceste căi.
    #
    # CAPCANĂ nginx: `add_header` ÎNTR-UN `location` ANULEAZĂ moștenirea celor de la
    # nivelul `server` (cele de mai sus) — repetate aici explicit, altfel fișierele
    # din /build ar ieși FĂRĂ ele.
    location ^~ /build/ {
        # DOAR `add_header Cache-Control`, nu și `expires 1y`: `expires` scrie tot un
        # header `Cache-Control: max-age=…`, iar `add_header` ADAUGĂ, nu înlocuiește —
        # împreună ar trimite DOUĂ headere `Cache-Control` pe același răspuns (verificat
        # cu `wget -S` pe imaginea construită local), fără `immutable` pe cel scris de
        # `expires`. Comportamentul browserului la headere duplicate cu același nume nu
        # e uniform — mai bine un singur header, complet.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), clipboard-write=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # `try_files $uri =404` înaintea pass-ului: fără el, nginx trimite spre PHP-FPM
        # orice cale care se termină în .php, inclusiv una inexistentă de forma
        # /fisier-incarcat.jpg/x.php — clasicul path-info execution. Aici nu există
        # încărcări în public/, dar regula costă o linie și scoate clasa de bug cu totul.
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
