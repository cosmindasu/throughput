; docker/app/php-fpm-pool.conf
; Înlocuiește pool-ul implicit [www] din imaginea de bază (php:8.3-fpm-alpine).
; Bugetul de memorie — §3.1/§3.2 din plan-implementare.md.

[www]
user = www-data
group = www-data

listen = 9000

; Variabilele injectate de docker-compose (dev) și de Coolify (producție, §2 din plan)
; trebuie să ajungă la PHP — fără asta, DB_PASSWORD/REDIS_PASSWORD/APP_KEY etc. nu se văd.
clear_env = no

; Procesele coboară aproape la zero între cereri (ADR-001), dar plafonul e explicit.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500
