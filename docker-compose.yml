services:
  app:
    build: { context: ., dockerfile: docker/app/Dockerfile, target: development }
    mem_limit: 512m
    memswap_limit: 512m
    volumes: [".:/var/www/html"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  horizon:
    build: { context: ., dockerfile: docker/app/Dockerfile, target: development }
    command: ["php", "artisan", "horizon"]
    mem_limit: 512m
    memswap_limit: 512m
    # Ca în producție (docker-compose.coolify.yml): plafonul de memorie al workerului de
    # coadă e 256M, nu implicitul de 128M al imaginii. Aici mai ales — un plafon diferit
    # între dev și producție ar însemna că un job care merge local pică pe server.
    environment:
      PHP_INI_SCAN_DIR: "/usr/local/etc/php/conf.d:/usr/local/etc/php/horizon.d"
    volumes: [".:/var/www/html"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  vite:
    image: node:22-alpine
    working_dir: /app
    # Legarea pe 0.0.0.0 (fără care portul publicat 5173 nu duce nicăieri) e în
    # vite.config.ts, într-un singur loc, nu duplicată aici ca flag de linie de comandă.
    # `node_modules` propriu, pe volum: cel de pe host e instalat pentru macOS, iar binarul nativ
    # al lui rolldown pentru `linux-arm64-musl` (Alpine) lipsește din el, deci `vite` pica la
    # pornire. `npm ci` în volum instalează binarele corecte pentru container, fără să atingă
    # `node_modules` de pe host.
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    volumes: [".:/app", "vite_node_modules:/app/node_modules"]
    ports: ["5173:5173"]

  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: throughput
      POSTGRES_USER: postgres          # superuser de bootstrap, NU un rol aplicativ — vezi §3.3
      POSTGRES_PASSWORD: secret
      APP_DB_PASSWORD: secret          # citit de scriptul de init pentru throughput_app
      MIGRATOR_DB_PASSWORD: secret     # citit de scriptul de init pentru throughput_migrator
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d throughput"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    memswap_limit: 256m
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vite_node_modules:
  postgres_data:
