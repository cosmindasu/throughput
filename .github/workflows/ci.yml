# CI — plan-implementare.md §5.
#
# Cota de minute GitHub Actions e comună pentru toate cele 12 proiecte private
# (2.000/lună, plan free), deci fiecare regulă de mai jos e deliberată:
#   - `concurrency` cu anulare: un push nou omoară run-ul învechit;
#   - `push` doar pe `main` și tag-uri (branch-urile de feature se testează prin PR),
#     cu `paths-ignore` pe documentație;
#   - job-urile ieftine (`quality`, `assets`) rulează pe orice PR, inclusiv draft;
#     jobul scump (`e2e`) stă în spatele lor și sare pe draft-uri;
#   - build-ul Vite se face o singură dată, în `assets`, și ajunge ca artefact în
#     `quality`: Pest randează `app.blade.php`, care cere manifestul. De aici
#     `quality` → `needs: assets`, deci `assets` (~25 s) e poarta jobului cu
#     Postgres + Redis, iar un build dublat în ambele joburi ar costa un minut în plus;
#   - exclusiv `ubuntu-latest` (1×), niciodată macOS (10×) sau Windows (2×);
#   - fără micro-job-uri: fiecare job se facturează rotunjit la minutul întreg, deci
#     axe-core e pas în `e2e`, nu job separat.
#
# Precauție, dacă se activează branch protection pe `main` mai târziu: cu
# `paths-ignore`, un PR doar-documentație nu declanșează niciun check, iar un
# required status check ar rămâne etern „pending" și ar bloca merge-ul. De
# confirmat explicit înainte de a porni protecția, nu implicit.
#
# Jobul `e2e` (Faza 2, v1.17): suita Playwright a intrat în repo
# (`e2e/playwright.config.ts`) — garda „Există suita E2E?" din schița de Sprint 0
# a dispărut. PR (inclusiv non-draft): subset `@smoke`. Push pe `main`/tag: suită
# completă, inclusiv axe-core pe ambele teme (§20.3). Lighthouse CI NU e în job:
# scos deliberat (nu uitat) — toate ecranele demo stau în spatele `/login`, iar un
# `@lhci/cli autorun` fără o configurație `lighthouserc` capabilă să autentifice ar
# măsura fie pagina de login, fie ar pica pe redirect. Revine cu acea configurație,
# separat (§24.4 cere Lighthouse doar pe tema implicită, deci un singur ecran
# autentificat + un cost mic de facturare suplimentară, de evaluat atunci).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: "PHP — lint, teste, izolare tenant"
    # Așteaptă build-ul Vite din `assets` (pasul de artefact de mai jos). Costul e
    # ~25 s de ceas, nu minute facturate; în schimb, un tsc/eslint/build picat nu mai
    # pornește degeaba Postgres + Redis.
    needs: assets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ["8.3"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: throughput_test
          # Superuser de bootstrap, NU un rol aplicativ: imaginea îl creează la
          # `initdb`, înaintea scripturilor de init, deci un `CREATE ROLE` pe el ar
          # eșua cu `role already exists` (capcana 1 din §3.3).
          POSTGRES_USER: throughput
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd "pg_isready -U throughput -d throughput_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      # Fără manifestul Vite, orice pagină Inertia răspunde 500
      # (`ViteManifestNotFoundException`). Primele run-uri pe `main` au picat exact
      # așa, iar local nu se vedea, fiindcă `public/build` exista pe disc.
      # `withoutVite()` în TestCase ar fi fost mai ieftin, dar ar fi orbit testul de
      # preload de fonturi din AppShellTest, care verifică tocmai căile din manifestul
      # REAL (un bump de @fontsource care mută fișierul).
      - uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "pdo_pgsql, pgsql, redis, gd, intl, zip, bcmath"
          coverage: pcov

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Lot I18N, Val 1 (ADR-022, FR-I18N-02) — gate blocant, IMEDIAT după `composer
      # install` și ÎNAINTE de bootstrap-ul Postgres și de suita Pest: o cheie
      # desperecheată en/fr oprește jobul aici, fără să ardă cele ~15 minute de teste,
      # iar `e2e` (needs: [quality, assets]) nu mai pornește deloc.
      #
      # Deliberat NU un job nou și NU împăturit în `assets`: un job separat s-ar factura
      # rotunjit la un minut întreg în plus la FIECARE run (regula globală „nu sparge în
      # micro-job-uri inutile"), iar în `assets` ar fi cerut `composer install` doar
      # pentru el — aici vendor-ul e deja instalat, deci costul marginal e durata
      # comenzii, câteva secunde.
      - name: "Acoperire chei i18n (en ↔ fr) — blocant"
        run: php artisan i18n:coverage

      # Exact același script ca dev și producție (§3.3), ca să nu existe derivă
      # între bootstrap-ul de CI și realitate. E un script shell, nu SQL: se
      # EXECUTĂ, nu se dă lui `psql -f` (are nevoie de variabilele de mediu cu
      # parolele, pe care `psql -f` nu le poate pasa).
      - name: "Bootstrap roluri Postgres (același script ca dev/prod)"
        run: bash docker/postgres/init/01-roles-and-extensions.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: throughput
          PGPASSWORD: secret
          POSTGRES_USER: throughput
          POSTGRES_DB: throughput_test
          APP_DB_PASSWORD: secret
          MIGRATOR_DB_PASSWORD: secret

      # Testele rulează ca `throughput_app` (fără BYPASSRLS), migrațiile ca
      # `throughput_migrator`. Fără separarea asta, RLS e inert în CI: rolul
      # serviciului Postgres e proprietarul tabelelor, iar politicile nu se aplică
      # proprietarului — testul de izolare ar trece verde fără să testeze nimic.
      - name: "Mediu de testare"
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
          {
            echo "APP_ENV=testing"
            # Serviciile CI sunt pe localhost, nu pe numele de host din docker-compose.
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=throughput_test"
            echo "DB_USERNAME=throughput_app"
            echo "DB_PASSWORD=secret"
            echo "DB_MIGRATIONS_USERNAME=throughput_migrator"
            echo "DB_MIGRATIONS_PASSWORD=secret"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PASSWORD=null"
          } >> .env.testing

      - run: ./vendor/bin/pint --test

      # Fără `--parallel` la Sprint 0, deliberat: testarea paralelă creează o bază
      # per proces (`throughput_test_test_1`, …), iar fiecare ar avea nevoie de
      # bootstrap-ul celor două roluri + `ALTER DEFAULT PRIVILEGES`, altfel testele
      # de izolare cad cu `permission denied`. Se reevaluează în Faza 1, când suita
      # devine suficient de mare ca paralelizarea să merite setup-ul.
      - run: ./vendor/bin/pest
        env:
          APP_ENV: testing

      - name: "Lint OpenAPI (Spectral)"
        run: npx --yes @stoplight/spectral-cli lint openapi/throughput-v1.yaml

      - run: composer audit --no-dev --format=plain --locked

  assets:
    name: "Node — typecheck, lint, build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint resources/js
      - run: npm run build

      # Consumat de `quality` (pasul pereche de acolo). O zi de retenție: artefactul
      # servește doar run-ului curent, nu ține spațiu de stocare pe cont.
      - uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: "Playwright — RBAC, comutare workspace, axe-core"
    # Jobul scump al pipeline-ului (§5.1): stă în spatele gate-urilor ieftine
    # (`quality`, `assets`) și sare pe draft-uri — un lint/typecheck/test picat nu
    # mai pornește degeaba Postgres + Chromium.
    needs: [quality, assets]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: throughput_e2e
          # Superuser de bootstrap (imaginea îl creează la `initdb`), NU un rol
          # aplicativ — la fel ca în `quality` (§3.3, capcana 1).
          POSTGRES_USER: throughput
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd "pg_isready -U throughput -d throughput_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      # FĂRĂ Redis: suita rulează cu `CACHE_STORE=array`, `SESSION_DRIVER=file`,
      # `QUEUE_CONNECTION=database` (e2e/support/env.ts) — un serviciu pornit doar
      # pentru acest job ar fi cost fără folos.
    steps:
      - uses: actions/checkout@v4

      # Manifestul Vite vine ca artefact din `assets` — NU se reface build-ul aici
      # (§5.1/plan §5.2): un al doilea build ar costa un minut facturat în plus,
      # iar fără el orice pagină Inertia (inclusiv `/login`) răspunde 500.
      - uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: "pdo_pgsql, pgsql, redis, gd, intl, zip, bcmath"
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Același script ca `quality`/dev/prod (§3.3), altă bază: `throughput_e2e`,
      # dedicată suitei Playwright, niciodată împărțită cu Pest (`throughput_test`).
      - name: "Bootstrap roluri Postgres (același script ca dev/quality)"
        run: bash docker/postgres/init/01-roles-and-extensions.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: throughput
          PGPASSWORD: secret
          POSTGRES_USER: throughput
          POSTGRES_DB: throughput_e2e
          APP_DB_PASSWORD: secret
          MIGRATOR_DB_PASSWORD: secret

      # `.env`, NU `.env.testing`: `php artisan serve` (webServer din
      # e2e/playwright.config.ts) și `e2e/global-setup.ts` citesc `.env` implicit.
      # Restul suprascrierilor (DB_*, CACHE_STORE, SESSION_DRIVER, QUEUE_CONNECTION,
      # DEMO_MODE) vin din `e2eEnv()` la runtime — scrise și aici ca bază validă
      # (APP_KEY etc.), la fel cum `quality` generează `.env.testing`.
      - name: "Mediu (.env pentru serverul Playwright)"
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "APP_ENV=local"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=throughput_e2e"
            echo "DB_USERNAME=throughput_app"
            echo "DB_PASSWORD=secret"
            echo "DB_MIGRATIONS_USERNAME=throughput_migrator"
            echo "DB_MIGRATIONS_PASSWORD=secret"
            echo "CACHE_STORE=array"
            echo "SESSION_DRIVER=file"
            echo "QUEUE_CONNECTION=database"
            echo "DEMO_MODE=true"
            echo "APP_URL=http://127.0.0.1:8010"
          } >> .env

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: "Versiunea Playwright din lockfile"
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}

      # La cache hit, binarul Chromium e deja pe disc — lipsesc doar bibliotecile
      # de sistem; la cache miss, descarcă tot (browser + dependențe).
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # PR (non-draft): subset `@smoke`. Push pe `main`/tag: suită completă (RBAC,
      # comutare workspace, axe-core pe ambele teme).
      #
      # Lot I18N, Val 5 — subsetul `@fr` (`e2e/specs/locale-fr.spec.ts`,
      # `e2e/specs/i18n-layout.spec.ts`) NU are nevoie de un pas propriu sau de vreo
      # modificare aici: teste tăguite `@fr` și NEtăguite `@smoke` nu se potrivesc cu
      # `--grep @smoke` de mai jos, deci nu rulează pe niciun PR, dar SUNT incluse în suita
      # completă (fără `--grep`) de pe `main`/tag-uri — exact comutarea de care are nevoie
      # (catalogul `fr` nu merită cost de CI pe fiecare PR). Verificat citind acest pas, nu
      # presupus.
      - name: "Playwright"
        # `e2eEnv()` (e2e/support/env.ts) citește DB_HOST/DB_PORT din mediul procesului, nu din
        # `.env`, cu implicitul local 55432. Fără ele aici, serverul și `migrate:fresh` ar căuta
        # Postgres pe 55432, nu pe serviciul jobului; local nu se vede, fiindcă acolo chiar există.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: npx playwright test -c e2e/playwright.config.ts ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '' || '--grep @smoke' }}

      # DOAR la eșec — un run verde n-are nimic de arătat, iar retenția scurtă
      # ține contul de stocare mic (§5.1).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 3
